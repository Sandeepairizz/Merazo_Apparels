<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#2C2416"/>
  <rect width="1920" height="1080" fill="url(#grain)" opacity="0.08"/>
  <line x1="0" y1="0" x2="1920" y2="1080" stroke="#666" stroke-width="0.5" opacity="0.2"/>
  <line x1="1920" y1="0" x2="0" y2="1080" stroke="#666" stroke-width="0.5" opacity="0.2"/>
  <text x="960" y="528" text-anchor="middle" font-family="monospace" font-size="11" fill="#666" letter-spacing="2" text-transform="uppercase">PLACEHOLDER</text>
  <text x="960" y="548" text-anchor="middle" font-family="monospace" font-size="13" fill="#E10600" letter-spacing="1" font-weight="bold">LINEN CAMPAIGN</text>
  <text x="960" y="566" text-anchor="middle" font-family="monospace" font-size="9" fill="#666" opacity="0.5">1920x1080</text>
</svg>
