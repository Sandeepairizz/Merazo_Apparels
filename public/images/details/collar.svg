<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="320" height="320" fill="#1a1a1a"/>
  <rect width="320" height="320" fill="url(#grain)" opacity="0.08"/>
  <line x1="0" y1="0" x2="320" y2="320" stroke="#888" stroke-width="0.5" opacity="0.2"/>
  <line x1="320" y1="0" x2="0" y2="320" stroke="#888" stroke-width="0.5" opacity="0.2"/>
  <text x="160" y="148" text-anchor="middle" font-family="monospace" font-size="11" fill="#888" letter-spacing="2" text-transform="uppercase">PLACEHOLDER</text>
  <text x="160" y="168" text-anchor="middle" font-family="monospace" font-size="13" fill="#E10600" letter-spacing="1" font-weight="bold">COLLAR</text>
  <text x="160" y="186" text-anchor="middle" font-family="monospace" font-size="9" fill="#888" opacity="0.5">320x320</text>
</svg>
