<svg xmlns="http://www.w3.org/2000/svg" width="560" height="747" viewBox="0 0 560 747">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="560" height="747" fill="#0d0d0d"/>
  <rect width="560" height="747" fill="url(#grain)" opacity="0.08"/>
  <line x1="0" y1="0" x2="560" y2="747" stroke="#444" stroke-width="0.5" opacity="0.2"/>
  <line x1="560" y1="0" x2="0" y2="747" stroke="#444" stroke-width="0.5" opacity="0.2"/>
  <text x="280" y="361.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#444" letter-spacing="2" text-transform="uppercase">PLACEHOLDER</text>
  <text x="280" y="381.5" text-anchor="middle" font-family="monospace" font-size="13" fill="#E10600" letter-spacing="1" font-weight="bold">SHIRT 02</text>
  <text x="280" y="399.5" text-anchor="middle" font-family="monospace" font-size="9" fill="#444" opacity="0.5">560x747</text>
</svg>
