<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2133" viewBox="0 0 1600 2133">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="1600" height="2133" fill="#1f1915"/>
  <rect width="1600" height="2133" fill="url(#grain)" opacity="0.08"/>
  <line x1="0" y1="0" x2="1600" y2="2133" stroke="#a57a4a" stroke-width="0.5" opacity="0.2"/>
  <line x1="1600" y1="0" x2="0" y2="2133" stroke="#a57a4a" stroke-width="0.5" opacity="0.2"/>
  <text x="800" y="1054.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#a57a4a" letter-spacing="2" text-transform="uppercase">PLACEHOLDER</text>
  <text x="800" y="1074.5" text-anchor="middle" font-family="monospace" font-size="13" fill="#E10600" letter-spacing="1" font-weight="bold">WOMAN / LINEN</text>
  <text x="800" y="1092.5" text-anchor="middle" font-family="monospace" font-size="9" fill="#a57a4a" opacity="0.5">1600x2133</text>
</svg>
