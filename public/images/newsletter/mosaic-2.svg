<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="400" height="480" fill="#111"/>
  <rect width="400" height="480" fill="url(#grain)" opacity="0.08"/>
  <line x1="0" y1="0" x2="400" y2="480" stroke="#555" stroke-width="0.5" opacity="0.2"/>
  <line x1="400" y1="0" x2="0" y2="480" stroke="#555" stroke-width="0.5" opacity="0.2"/>
  <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="11" fill="#555" letter-spacing="2" text-transform="uppercase">PLACEHOLDER</text>
  <text x="200" y="248" text-anchor="middle" font-family="monospace" font-size="13" fill="#E10600" letter-spacing="1" font-weight="bold">MOSAIC 2</text>
  <text x="200" y="266" text-anchor="middle" font-family="monospace" font-size="9" fill="#555" opacity="0.5">400x480</text>
</svg>
