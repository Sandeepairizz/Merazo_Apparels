<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1067" viewBox="0 0 800 1067">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="800" height="1067" fill="#1a1a1a"/>
  <rect width="800" height="1067" fill="url(#grain)" opacity="0.08"/>
  <line x1="0" y1="0" x2="800" y2="1067" stroke="#666" stroke-width="0.5" opacity="0.2"/>
  <line x1="800" y1="0" x2="0" y2="1067" stroke="#666" stroke-width="0.5" opacity="0.2"/>
  <text x="400" y="521.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#666" letter-spacing="2" text-transform="uppercase">PLACEHOLDER</text>
  <text x="400" y="541.5" text-anchor="middle" font-family="monospace" font-size="13" fill="#E10600" letter-spacing="1" font-weight="bold">CLASSIC FIT</text>
  <text x="400" y="559.5" text-anchor="middle" font-family="monospace" font-size="9" fill="#666" opacity="0.5">800x1067</text>
</svg>
