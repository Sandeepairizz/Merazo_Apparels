<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="960" height="1200" fill="#201a15"/>
  <rect width="960" height="1200" fill="url(#grain)" opacity="0.08"/>
  <line x1="0" y1="0" x2="960" y2="1200" stroke="#777" stroke-width="0.5" opacity="0.2"/>
  <line x1="960" y1="0" x2="0" y2="1200" stroke="#777" stroke-width="0.5" opacity="0.2"/>
  <text x="480" y="588" text-anchor="middle" font-family="monospace" font-size="11" fill="#777" letter-spacing="2" text-transform="uppercase">PLACEHOLDER</text>
  <text x="480" y="608" text-anchor="middle" font-family="monospace" font-size="13" fill="#E10600" letter-spacing="1" font-weight="bold">WOMEN / SATIN-2</text>
  <text x="480" y="626" text-anchor="middle" font-family="monospace" font-size="9" fill="#777" opacity="0.5">960x1200</text>
</svg>
