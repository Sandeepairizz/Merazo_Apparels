<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="600" height="900" fill="#F6F5F2"/>
  <rect width="600" height="900" fill="url(#grain)" opacity="0.08"/>
  <line x1="0" y1="0" x2="600" y2="900" stroke="#aaa" stroke-width="0.5" opacity="0.2"/>
  <line x1="600" y1="0" x2="0" y2="900" stroke="#aaa" stroke-width="0.5" opacity="0.2"/>
  <text x="300" y="438" text-anchor="middle" font-family="monospace" font-size="11" fill="#aaa" letter-spacing="2" text-transform="uppercase">PLACEHOLDER</text>
  <text x="300" y="458" text-anchor="middle" font-family="monospace" font-size="13" fill="#E10600" letter-spacing="1" font-weight="bold">MODEL CUTOUT</text>
  <text x="300" y="476" text-anchor="middle" font-family="monospace" font-size="9" fill="#aaa" opacity="0.5">600x900</text>
</svg>
